[project]
name = "spec-driven-development-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "openai>=3.33.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "tiktoken>=0.14.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.22.1",
    "typer>=0.27.3",
]

[project.scripts]
sdd-agent = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
python_functions = ["test_*", "*_test"]
python_classes = []

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "C4", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "cli", "commands", "llm", "models", "parsers", "testrunner", "tools", "validators"]
